name: Build Manylinux Wheels

# Trigger on version tags and manual dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# wheels are only uploaded as artifacts, publishing happens outside of this workflow
permissions:
  contents: read

env:
  # The "a" suffixes are load-bearing, not cosmetic: setup.py gates the kpacked
  # WGMMA (sm_90a) and tcgen05 (sm_100a) kernels on the literal strings 9.0a /
  # 10.0a via _torch_cuda_arch_list_has(). Plain "9.0"/"10.0" builds, but
  # silently compiles those kernels out.
  # 10.0a and 12.0 are omitted for CUDA 12.6: sm_100/sm_120 only exist from 12.8.
  CUDA_ARCH_MAP: '{"12.6": "8.0;8.6;8.9;9.0a+PTX", "12.8": "8.0;8.6;8.9;9.0a;10.0a;12.0+PTX", "12.9": "8.0;8.6;8.9;9.0a;10.0a;12.0+PTX", "13.0": "8.0;8.6;8.9;9.0a;10.0a;12.0+PTX", "none": ""}'

jobs:
  build-manylinux-wheels:
    runs-on: ubuntu-latest
    strategy:
      # One CUDA variant failing should not hide the state of the other five:
      # they build independently and a release needs all of them.
      fail-fast: false
      matrix:
        include:
          # One build per CUDA version, using the oldest torch that supports it.
          # This gives the widest torch runtime compatibility for each CUDA variant.
          #
          # builder-image: CUDA builds run in PyTorch's manylinux_2_28 builder,
          # which ships the CUDA toolkit -- the stock cibuildwheel image has no
          # nvcc, so the CUDA kernels cannot be compiled there at all. Pinned by
          # digest for the same reason the build tooling is pinned: a silently
          # updated builder image would change what we ship with no diff.
          # build-cuda: forces the CUDA extension on. Auto-detection cannot work
          # here because it requires torch.cuda.is_available(), and the build
          # runners have no GPU.
          - torch-version: '2.6.0'
            torch-cuda: 'cu126'
            cuda-version: '12.6'
            python-builds: 'cp310-* cp311-* cp312-*'
            build-cuda: '1'
            builder-image: 'pytorch/manylinux2_28-builder@sha256:e403d8c2bbb43e6d84704efcfa4c8c148bbe08edc2e69dac4c99546ed6c46cc7'
          - torch-version: '2.7.0'
            torch-cuda: 'cu128'
            cuda-version: '12.8'
            python-builds: 'cp310-* cp311-* cp312-*'
            build-cuda: '1'
            builder-image: 'pytorch/manylinux2_28-builder@sha256:404e7cddd7a2d4d7368c5a22416aaa10630d448aa97195a7864efbd9b05fa1c0'
          - torch-version: '2.8.0'
            torch-cuda: 'cu129'
            cuda-version: '12.9'
            python-builds: 'cp310-* cp311-* cp312-*'
            build-cuda: '1'
            builder-image: 'pytorch/manylinux2_28-builder@sha256:d26cd7a9489b53310296e86042de630ac947e25a71dd24b547b86ca9a0a3fc79'
          - torch-version: '2.9.1'
            torch-cuda: 'cu130'
            cuda-version: '13.0'
            python-builds: 'cp310-* cp311-* cp312-*'
            build-cuda: '1'
            builder-image: 'pytorch/manylinux2_28-builder@sha256:83d73c3fd2782b23de8a1873820236273d8a6db911aea15c017766c9a40e723c'
          - torch-version: '2.11.0'
            torch-cuda: 'cu130'
            cuda-version: '13.0'
            python-builds: 'cp310-* cp311-* cp312-*'
            build-cuda: '1'
            builder-image: 'pytorch/manylinux2_28-builder@sha256:83d73c3fd2782b23de8a1873820236273d8a6db911aea15c017766c9a40e723c'
          # CPU-only build based on latest PyTorch. Stock cibuildwheel image.
          - torch-version: '2.11.0'
            torch-cuda: 'cpu'
            cuda-version: 'none'
            python-builds: 'cp310-* cp311-* cp312-*'
            build-cuda: '0'
            builder-image: ''

    steps:
    - uses: actions/checkout@v5
      # setuptools-scm reads the released version off the git tag, and the
      # default shallow, --no-tags checkout gives it nothing to describe against.
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Free Disk Space
      run: |
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install cibuildwheel
      run: |
        python -m pip install -r .github/requirements/build-tools.txt

    - name: Set CUDA architecture list
      run: |
        ARCH_LIST=$(echo "$CUDA_ARCH_MAP" | jq -r '.["${{ matrix.cuda-version }}"]')
        echo "TORCH_CUDA_ARCH_LIST=$ARCH_LIST" >> $GITHUB_ENV

    # Derived from the git tag, the single source of truth (see
    # [tool.setuptools_scm] in pyproject.toml). On a tag push this is the exact
    # release, e.g. "0.9.2"; off-tag it is a dev version, e.g. "0.9.3.dev83".
    # The local segment is stripped because CIBW_ENVIRONMENT below appends its
    # own +torch<ver>.<cuda>, and PEP 440 permits only one.
    - name: Determine base version from git
      run: |
        BASE_VERSION=$(python -c "from setuptools_scm import get_version; print(get_version().split('+')[0])")
        echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_ENV
        echo "Base version: $BASE_VERSION"

    # Release gate. Everything downstream -- wheel metadata, the GitHub release,
    # the Kitmaker repack -- inherits BASE_VERSION, so this is the last point at
    # which a wrong version is cheap to catch rather than published.
    #
    # Deliberately scoped to tag pushes only: dev builds (PRs, workflow_dispatch,
    # and every local build) are expected to produce .devN versions and must not
    # be blocked by this.
    - name: Verify release version matches the tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        python - <<'PY'
        import os, sys
        from packaging.version import Version, InvalidVersion

        tag_name = os.environ["TAG_NAME"]
        base = os.environ["BASE_VERSION"]
        errors = []

        if base == "0.0.0":
            errors.append(
                "version resolved to the 0.0.0 fallback -- setuptools-scm found no git "
                "metadata.\n    Check that the checkout uses fetch-depth: 0 and fetch-tags: true."
            )

        try:
            parsed = Version(base)
        except InvalidVersion:
            errors.append(f"{base!r} is not a valid PEP 440 version.")
            parsed = None

        if parsed is not None:
            if parsed.is_devrelease:
                errors.append(
                    f"{base!r} is a dev version. The build is not exactly on the tag, or the\n"
                    "    working tree is dirty, so setuptools-scm guessed the *next* version."
                )
            if parsed.local:
                errors.append(f"{base!r} carries a local segment; it must be stripped.")
            try:
                # Normalized compare, so a tag of v0.9.2c is correctly seen as 0.9.2rc0.
                if parsed != Version(tag_name.removeprefix("v")):
                    errors.append(
                        f"built version {base!r} does not match tag {tag_name!r}."
                    )
            except InvalidVersion:
                errors.append(f"tag {tag_name!r} is not a valid PEP 440 version.")

        if errors:
            print("ERROR: refusing to build release wheels.\n")
            for e in errors:
                print(f"  - {e}")
            sys.exit(1)

        # A pre-release is legitimate when the tag itself declares one (v1.0.0rc1).
        note = " (pre-release, as declared by the tag)" if parsed.is_prerelease else ""
        print(f"OK: building {base} for tag {tag_name}{note}")
        PY

    - name: Build manylinux wheels
      env:
        CIBW_BEFORE_BUILD: |
          set -e
          pip install --upgrade -r {project}/.github/requirements/wheel-build-env.txt
          pip install --no-cache-dir torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/${{ matrix.torch-cuda }}
          pip install numpy
        CIBW_BEFORE_TEST: |
          set -e
          pip install torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/${{ matrix.torch-cuda }}
          pip install numpy
        CIBW_BUILD: ${{ matrix.python-builds }}
        TORCH_CUDA_VERSION: ${{ matrix.cuda-version }}
        TORCH_CUDA_ARCH_LIST: ${{ env.TORCH_CUDA_ARCH_LIST }}
        # CUDA builds run in PyTorch's manylinux builder (it has nvcc); the
        # CPU-only row keeps cibuildwheel's stock image, which an empty value
        # selects.
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ matrix.builder-image }}
        # TORCH_CUDA_ARCH_LIST must be listed here explicitly: variables set on
        # the runner do not reach the build container, which is why the arch
        # list previously had no effect. Quoted because it contains ';'.
        CIBW_ENVIRONMENT: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.BASE_VERSION }}+torch${{ matrix.torch-version }}.${{ matrix.torch-cuda }} TORCH_CUDA_VERSION=${{ matrix.cuda-version }} TORCH_HARMONICS_BUILD_CUDA_EXTENSION=${{ matrix.build-cuda }} TORCH_CUDA_ARCH_LIST='${{ env.TORCH_CUDA_ARCH_LIST }}' TORCH_HARMONICS_ENABLE_OPENMP=1 TORCHINDUCTOR_COMPILE_THREADS=1"
        CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
          set -e
          TORCH_LIB=$(python -c "import torch, os; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
          # CUDA runtime libraries must be excluded as well as torch's own. They
          # are supplied at runtime by torch's nvidia-*-cu12 dependencies, which
          # are already loaded by the time our extension is imported. Bundling
          # them would duplicate hundreds of MB per wheel and blow the 100 MB
          # limit; not excluding them fails the repair outright, because
          # libcudart lives in site-packages/nvidia/*/lib rather than torch/lib.
          NVIDIA_LIBS=$(python -c "
          import glob, os, site
          dirs = []
          for sp in site.getsitepackages():
              dirs += glob.glob(os.path.join(sp, 'nvidia', '*', 'lib'))
          print(' '.join(dirs))
          ")
          EXCLUDES=$(for d in "$TORCH_LIB" $NVIDIA_LIBS /usr/local/cuda/lib64 /usr/local/cuda/targets/x86_64-linux/lib; do
            [ -d "$d" ] && find "$d" -maxdepth 1 -name '*.so*'
          done | xargs -r -I{} basename {} | sort -u | sed 's/^/--exclude /' | tr '\n' ' ')
          echo "auditwheel excludes: $EXCLUDES"
          LD_LIBRARY_PATH="$TORCH_LIB:${LD_LIBRARY_PATH:-}" auditwheel repair $EXCLUDES -w {dest_dir} {wheel}
          for whl in {dest_dir}/*.whl; do
            python -m wheel unpack "$whl" --dest /tmp/strip_tmp
            rm -f "$whl"
            find /tmp/strip_tmp -name '*.so' -exec strip --strip-debug {} \;
            python -m wheel pack /tmp/strip_tmp/* --dest {dest_dir}
            rm -rf /tmp/strip_tmp
          done

      run: |
        cibuildwheel --platform linux

    - name: Inspect built wheels and .so files
      if: always()
      run: |
        echo "Listing wheelhouse contents:"
        ls -lh wheelhouse/
        echo "Checking .so symbols and ABI:"
        for whl in wheelhouse/*.whl; do
          echo "==== $whl ===="
          tmpdir=$(mktemp -d)
          python -m zipfile -e "$whl" "$tmpdir"
          for so in $(find "$tmpdir" -name '*.so'); do
            echo "  -- $so --"
            nm -D "$so" | grep exception_ptr || echo "  No exception_ptr symbols found"
            strings "$so" | grep ABI || echo "  No ABI macro found"
          done
          rm -rf "$tmpdir"
        done

    # A CUDA-labelled wheel that contains no CUDA is the failure this guards
    # against: it does not crash, it silently falls back to torch-native paths,
    # so it survived several releases unnoticed. Assert the kernels are really
    # in there rather than trusting the build flags.
    - name: Verify CUDA kernels are present in the wheels
      if: matrix.build-cuda == '1'
      run: |
        set -e
        failed=0
        for whl in wheelhouse/*.whl; do
          tmpdir=$(mktemp -d)
          python -m zipfile -e "$whl" "$tmpdir"
          for so in $(find "$tmpdir" -path '*/torch_harmonics/*' -name '_C*.so'); do
            if readelf -SW "$so" | grep -q '\.nv_fatbin' \
               || nm -D "$so" 2>/dev/null | grep -q '__cudaRegisterFatBinary'; then
              echo "OK:   $(basename "$whl") :: $(basename "$so") contains CUDA code"
            else
              echo "FAIL: $(basename "$whl") :: $(basename "$so") has NO CUDA code"
              failed=1
            fi
          done
          rm -rf "$tmpdir"
        done
        if [ "$failed" -ne 0 ]; then
          echo ""
          echo "This wheel is labelled for CUDA ${{ matrix.cuda-version }} but the"
          echo "extension modules contain no device code. Check that nvcc is present"
          echo "in the builder image and that TORCH_HARMONICS_BUILD_CUDA_EXTENSION"
          echo "reached the build container."
          exit 1
        fi

    - name: Upload wheel artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wheel-torch-${{ matrix.torch-version }}-${{ matrix.torch-cuda }}
        path: wheelhouse/*.whl

    - name: Repack wheels for PyPI (strip local version identifier)
      if: matrix.torch-version == '2.11.0' && matrix.torch-cuda == 'cu130'
      run: |
        pip install -r .github/requirements/build-tools.txt
        mkdir -p pypi-wheelhouse
        for whl in wheelhouse/*.whl; do
          tmpdir=$(mktemp -d)
          python -m wheel unpack "$whl" --dest "$tmpdir"
          pkg_dir="$tmpdir/$(ls "$tmpdir")"
          dist_info=$(ls "$pkg_dir" | grep '\.dist-info$')
          base_ver=$(grep '^Version:' "$pkg_dir/$dist_info/METADATA" | sed 's/Version: //' | sed 's/+.*//')
          pkg_name=$(echo "$dist_info" | sed 's/-[^-]*\.dist-info//')
          sed -i "s/^Version:.*/Version: $base_ver/" "$pkg_dir/$dist_info/METADATA"
          new_dist_info="${pkg_name}-${base_ver}.dist-info"
          [ "$dist_info" != "$new_dist_info" ] && mv "$pkg_dir/$dist_info" "$pkg_dir/$new_dist_info"
          new_pkg_dir="$tmpdir/${pkg_name}-${base_ver}"
          [ "$pkg_dir" != "$new_pkg_dir" ] && mv "$pkg_dir" "$new_pkg_dir"
          python -m wheel pack "$new_pkg_dir" --dest pypi-wheelhouse/
          rm -rf "$tmpdir"
        done

    - name: Inspect repacked wheels and .so files
      if: always() && (matrix.torch-version == '2.11.0' && matrix.torch-cuda == 'cu130')
      run: |
        pip install -r .github/requirements/build-tools.txt

        echo "=== twine check ==="
        python -m twine check pypi-wheelhouse/*.whl

        echo "=== auditwheel show ==="
        for whl in wheelhouse/*.whl; do
          echo "-- $whl --"
          auditwheel show "$whl"
        done

        echo "=== Listing pypi-wheelhouse contents ==="
        ls -lh pypi-wheelhouse/

        echo "=== Checking .so symbols and ABI ==="
        for whl in pypi-wheelhouse/*.whl; do
          echo "==== $whl ===="
          tmpdir=$(mktemp -d)
          python -m zipfile -e "$whl" "$tmpdir"
          for so in $(find "$tmpdir" -name '*.so'); do
            echo "  -- $so --"
            nm -D "$so" | grep exception_ptr || echo "  No exception_ptr symbols found"
            strings "$so" | grep ABI || echo "  No ABI macro found"
          done
          rm -rf "$tmpdir"
        done

        echo "=== Install + import test ==="
        python -m venv /tmp/test_venv
        /tmp/test_venv/bin/pip install --quiet torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu
        /tmp/test_venv/bin/pip install --quiet pypi-wheelhouse/*cp311*.whl
        cd /tmp && /tmp/test_venv/bin/python -c "import torch_harmonics; print('import OK, version:', torch_harmonics.__version__)"

    # 100 MB is PyPI's per-file limit without an exemption. CUDA wheels carry
    # cubins for every arch in TORCH_CUDA_ARCH_LIST, so this is a real ceiling
    # here, not a formality -- if it trips, trim the arch list rather than
    # raising the limit.
    - name: Check wheel sizes (must be <= 100 MB)
      run: |
        WHL_DIR=$([ -d pypi-wheelhouse ] && echo pypi-wheelhouse || echo wheelhouse)
        MAX_SIZE_BYTES=100000000
        FAILED=0
        for whl in "$WHL_DIR"/*.whl; do
          SIZE_BYTES=$(stat -c%s "$whl")
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES / 1000000}")
          if [ "$SIZE_BYTES" -gt "$MAX_SIZE_BYTES" ]; then
            echo "FAIL: $whl is ${SIZE_MB} MB (> 100 MB)"
            FAILED=1
          else
            echo "OK:   $whl is ${SIZE_MB} MB"
          fi
        done
        [ "$FAILED" -eq 0 ] || exit 1

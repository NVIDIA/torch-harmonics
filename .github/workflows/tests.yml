name: Run local tests

on:
  push:
  pull_request:
  workflow_dispatch:

# read-only by default; the coverage job alone gets write access, to publish the badge and
# the pull request comment with the workflow's own token
permissions:
  contents: read

jobs:
  build:
    name: Run local tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Install package with dev dependencies
      run: |
        python3 -m pip install --no-build-isolation -e ".[dev]"

    - name: Test with pytest
      env:
        # a distinct name, so the coverage job can combine it with the distributed suite's
        COVERAGE_FILE: .coverage.serial
      run: |
        python3 -m pytest -ra --cov-report term --cov-config=.coveragerc --cov=torch_harmonics \
          --ignore-glob="**/test_distributed_*" ./tests/

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-serial
        path: .coverage.serial
        include-hidden-files: true

    # Execute the ">>>" examples in the package docstrings. Sphinx renders them
    # into the API docs, where they read as verified output, so an unchecked one
    # is documentation that lies: before this step existed every example in the
    # package was inert, and several had been wrong for releases. Kept separate
    # from the suite above so that a broken example is its own red mark and does
    # not move the coverage number.
    - name: Doctest the package docstrings
      run: |
        python3 -m pytest -ra --doctest-modules ./torch_harmonics/

  # The distributed suite: on pull requests, and once per merge to main, so the coverage
  # below covers both suites. Not on plain branch pushes -- up to 8 ranks per grid is heavy.
  distributed:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/test_distributed.yml

  # Combine the serial and distributed coverage. On main, publish it -- badge, HTML report
  # and the reference for later comparisons -- to the python-coverage-comment-action-data
  # branch of this repository; on a pull request, comment on it with the coverage change and
  # the coverage of the lines it touches. Uses only the workflow's own token.
  coverage:
    name: Coverage
    needs: [build, distributed]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the coverage data branch (main only)
      pull-requests: write  # comment on same-repository pull requests; fork PRs get a read-only token, see coverage_comment.yml
    steps:
    - uses: actions/checkout@v5
      with:
        # the action passes its token to git itself; keep the write token out of .git/config
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        path: covdata
        merge-multiple: true

    - name: Combine serial and distributed coverage
      run: |
        python3 -m pip install coverage
        # combined here rather than by the action, which would not apply the [paths]
        # remapping of the distributed jobs' site-packages paths
        python3 -m coverage combine --rcfile=.coveragerc covdata
        python3 -m coverage report --rcfile=.coveragerc | tail -1

    - name: Publish coverage
      id: coverage_comment
      uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f  # v4.5
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 90
        MINIMUM_ORANGE: 60

    # a fork's pull request gets a read-only token, so the action only writes the comment to
    # a file; coverage_comment.yml posts it from a trusted context
    - name: Store the pull request comment
      if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: python-coverage-comment-action
        path: python-coverage-comment-action.txt

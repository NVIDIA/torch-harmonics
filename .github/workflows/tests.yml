name: Run local tests

on:
  push:
  pull_request:
  workflow_dispatch:

# the coverage badge step authenticates with its own PAT, so the workflow token stays read-only
permissions:
  contents: read

jobs:
  build:
    name: Run local tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Install package with dev dependencies
      run: |
        python3 -m pip install --no-build-isolation -e ".[dev]"

    - name: Test with pytest
      env:
        # a distinct name, so the coverage job can combine it with the distributed suite's
        COVERAGE_FILE: .coverage.serial
      run: |
        python3 -m pytest -ra --cov-report term --cov-config=.coveragerc --cov=torch_harmonics \
          --ignore-glob="**/test_distributed_*" ./tests/

    - uses: actions/upload-artifact@v4
      with:
        name: coverage-serial
        path: .coverage.serial
        include-hidden-files: true

    # Execute the ">>>" examples in the package docstrings. Sphinx renders them
    # into the API docs, where they read as verified output, so an unchecked one
    # is documentation that lies: before this step existed every example in the
    # package was inert, and several had been wrong for releases. Kept separate
    # from the suite above so that a broken example is its own red mark and does
    # not move the coverage number.
    - name: Doctest the package docstrings
      run: |
        python3 -m pytest -ra --doctest-modules ./torch_harmonics/

  # The distributed suite, once per merge to main, so the badge covers both suites. On pull
  # requests it runs from its own trigger in test_distributed.yml instead.
  distributed:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test_distributed.yml

  # Combine the serial and distributed coverage and publish it as the badge.
  coverage:
    name: Coverage badge
    needs: [build, distributed]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        path: covdata
        merge-multiple: true

    - name: Combine serial and distributed coverage
      run: |
        python3 -m pip install coverage
        python3 -m coverage combine --rcfile=.coveragerc covdata
        python3 -m coverage report --rcfile=.coveragerc --format=markdown >> "$GITHUB_STEP_SUMMARY"
        python3 -m coverage json --rcfile=.coveragerc

    - name: Update coverage badge
      env:
        GIST_TOKEN: ${{ secrets.COVERAGE_GIST_TOKEN }}
      run: |
        COV=$(python3 -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
        COLOR=$(python3 -c "
        c = float('$COV')
        print('brightgreen' if c >= 90 else 'green' if c >= 75 else 'yellow' if c >= 60 else 'red')
        ")
        PAYLOAD=$(python3 -c "
        import json
        print(json.dumps({'files': {'torch_harmonics_coverage.json': {'content': json.dumps({'schemaVersion': 1, 'label': 'coverage', 'message': '${COV}%', 'color': '${COLOR}'})}}}))
        ")
        curl -s -X PATCH \
          -H "Authorization: token ${GIST_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -d "$PAYLOAD" \
          "https://api.github.com/gists/5d08af0f7f08ac865934a1929f198ffd"
